services:
  - type: web
    name: nanzhuang-fragrance
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.1
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
